<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Organizador de Figurinhas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b141a; color: #e9edef; display: flex; height: 100vh; overflow: hidden; }

    #lateral { width: 300px; border-right: 1px solid #202c33; display: flex; flex-direction: column; padding: 18px; background: #111b21; }
    h2 { font-size: 14px; margin-bottom: 12px; color: #8696a0; text-transform: uppercase; letter-spacing: 0.5px; }
    #lista-categorias { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; padding-right: 4px; }
    .cat-btn { background: #182229; border: 1px solid #222e35; color: #d1d7db; padding: 10px 14px; border-radius: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 14px; transition: 0.15s; }
    .cat-btn:hover { border-color: #00a884; }
    .cat-btn.ativo { background: #00a884; border-color: #00a884; color: #111b21; font-weight: bold; }
    .badge { font-size: 12px; background: rgba(0,0,0,0.3); padding: 3px 8px; border-radius: 10px; }

    .btn-salvar { width: 100%; padding: 13px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; cursor: pointer; background: #00a884; color: #111b21; transition: 0.2s; }
    .btn-salvar:hover { background: #06cf9c; }

    #conteudo { flex: 1; display: flex; flex-direction: column; padding: 20px 24px; overflow: hidden; }
    .topo-acoes { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px solid #202c33; padding-bottom: 12px; }
    .topo-info h1 { font-size: 18px; color: #e9edef; }
    .topo-info span { font-size: 13px; color: #8696a0; }
    
    .topo-botoes { display: flex; gap: 10px; align-items: center; }
    .btn-aba { background: #202c33; border: 1px solid #2a3942; color: #e9edef; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn-aba.ativo { background: #00a884; color: #111b21; border-color: #00a884; font-weight: bold; }

    #grade-figurinhas { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap: 10px; overflow-y: auto; padding-right: 6px; align-content: flex-start; }
    
    .card-item { background: #111b21; border: 2px solid #202c33; border-radius: 8px; padding: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: 0.15s; position: relative; user-select: none; height: 125px; }
    .card-item:hover { border-color: #3b4a54; }
    .card-item img { max-width: 75px; max-height: 75px; object-fit: contain; }
    .card-item .nome-img { font-size: 10px; color: #8696a0; margin-top: 6px; width: 100%; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .card-item.marcado { border-color: #00a884; background: #0c2723; }
    .card-item.marcado::after { content: "✓"; position: absolute; top: 4px; right: 6px; background: #00a884; color: #111b21; font-weight: bold; font-size: 10px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>

  <div id="lateral">
    <h2>Categorias</h2>
    <div id="lista-categorias"></div>
    <button class="btn-salvar" id="btnSalvarTudo">💾 Salvar no figurinhas.json</button>
  </div>

  <div id="conteudo">
    <div class="topo-acoes">
      <div class="topo-info">
        <h1 id="titulo-categoria">Categoria: Memes</h1>
        <span id="texto-contador"></span>
      </div>
      <div class="topo-botoes">
        <button class="btn-aba ativo" id="btnVerCategoria" onclick="mudarModo(false)">Exibir Figurinhas da Categoria</button>
        <button class="btn-aba" id="btnVerTodos" onclick="mudarModo(true)">+ Adicionar Mais Figurinhas</button>
      </div>
    </div>

    <div id="grade-figurinhas"></div>
  </div>

  <script>
    const listaCategorias = [
      { id: "memes", label: "Memes" },
      { id: "bom-dia", label: "Bom Dia" },
      { id: "boa-tarde", label: "Boa Tarde" },
      { id: "boa-noite", label: "Boa Noite" },
      { id: "reacoes", label: "Reações" },
      { id: "humor", label: "Humor" },
      { id: "animais", label: "Animais" },
      { id: "triste", label: "Triste" },
      { id: "feliz", label: "Feliz" },
      { id: "times", label: "Times" },
      { id: "cachorro", label: "Cachorro" },
      { id: "gato", label: "Gato" },
      { id: "politica", label: "Política" },
      { id: "religiao", label: "Religião" }
    ];

    let arquivosPasta = [];
    let mapa = {};
    let categoriaAtiva = "memes";
    let modoExplorar = false;

    listaCategorias.forEach(c => mapa[c.id] = new Set());

    async function iniciar() {
      const respArq = await fetch('/api/arquivos');
      arquivosPasta = await respArq.json();

      const respDados = await fetch('/api/carregar');
      const dados = await respDados.json();

      // Carrega diretamente pelas chaves exatas do figurinhas.json ("bom-dia", "reacoes", etc)
      listaCategorias.forEach(c => {
        const itens = dados[c.id] || [];
        itens.forEach(nome => {
          const achado = arquivosPasta.find(a => a === nome || a.startsWith(nome + "."));
          if (achado) {
            mapa[c.id].add(achado);
          } else {
            const nomeFormatado = nome.includes('.') ? nome : `${nome}.webp`;
            mapa[c.id].add(nomeFormatado);
          }
        });
      });

      desenharLateral();
      renderizarGrade();
    }

    function desenharLateral() {
      const cont = document.getElementById('lista-categorias');
      cont.innerHTML = listaCategorias.map(c => `
        <div class="cat-btn ${c.id === categoriaAtiva ? 'ativo' : ''}" onclick="mudarCategoria('${c.id}')">
          <span>${c.label}</span>
          <span class="badge">${mapa[c.id].size}</span>
        </div>
      `).join('');

      const catObj = listaCategorias.find(c => c.id === categoriaAtiva);
      document.getElementById('titulo-categoria').textContent = 'Categoria: ' + (catObj ? catObj.label : '');
    }

    function mudarCategoria(catId) {
      categoriaAtiva = catId;
      modoExplorar = false;
      atualizarBotoesAba();
      desenharLateral();
      renderizarGrade();
    }

    function mudarModo(explorar) {
      modoExplorar = explorar;
      atualizarBotoesAba();
      renderizarGrade();
    }

    function atualizarBotoesAba() {
      document.getElementById('btnVerCategoria').classList.toggle('ativo', !modoExplorar);
      document.getElementById('btnVerTodos').classList.toggle('ativo', modoExplorar);
    }

    function renderizarGrade() {
      const grid = document.getElementById('grade-figurinhas');
      const total = mapa[categoriaAtiva].size;
      const catNome = listaCategorias.find(c => c.id === categoriaAtiva).label;

      if (!modoExplorar) {
        // Exibição FIEL: mostra exatamente a quantidade que pertence à categoria
        document.getElementById('texto-contador').textContent = `Mostrando ${total} figurinhas cadastradas em "${catNome}". Clique para remover.`;
        const itens = Array.from(mapa[categoriaAtiva]);

        if (itens.length === 0) {
          grid.innerHTML = '<div style="grid-column: 1/-1; padding: 40px; text-align: center; color: #8696a0;">Nenhuma figurinha nesta categoria. Clique em "+ Adicionar Mais Figurinhas" acima.</div>';
          return;
        }

        grid.innerHTML = itens.map(nomeArq => `
          <div class="card-item marcado" onclick="alternarItem('${nomeArq}')">
            <img src="/figurinhas/${nomeArq}" loading="lazy" alt="${nomeArq}">
            <span class="nome-img" title="${nomeArq}">${nomeArq}</span>
          </div>
        `).join('');
      } else {
        // Modo de explorar a pasta geral para marcar novas figurinhas
        document.getElementById('texto-contador').textContent = `Mostrando todos os arquivos da pasta para você marcar e adicionar em "${catNome}".`;
        grid.innerHTML = arquivosPasta.map(nomeArq => {
          const estaMarcado = mapa[categoriaAtiva].has(nomeArq);
          return `
            <div class="card-item ${estaMarcado ? 'marcado' : ''}" onclick="alternarItem('${nomeArq}')">
              <img src="/figurinhas/${nomeArq}" loading="lazy" alt="${nomeArq}">
              <span class="nome-img" title="${nomeArq}">${nomeArq}</span>
            </div>
          `;
        }).join('');
      }
    }

    function alternarItem(nomeArq) {
      if (mapa[categoriaAtiva].has(nomeArq)) {
        mapa[categoriaAtiva].delete(nomeArq);
      } else {
        mapa[categoriaAtiva].add(nomeArq);
      }
      desenharLateral();
      renderizarGrade();
    }

    document.getElementById('btnSalvarTudo').onclick = async () => {
      const payload = { categorias: {} };
      listaCategorias.forEach(c => {
        payload.categorias[c.id] = Array.from(mapa[c.id]).map(a => {
          if (a.toLowerCase().endsWith('.gif')) {
            return a;
          }
          return a.replace(/\.[^/.]+$/, "");
        });
      });

      const resp = await fetch('/api/salvar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (resp.ok) {
        alert('figurinhas.json salvo com sucesso!');
        window.location.reload();
      } else {
        alert('Erro ao gravar figurinhas.json');
      }
    };

    iniciar();
  </script>
</body>
</html>
