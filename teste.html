<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teste GIF WhatsApp</title>
  <style>
    body {
      background-color: #0b141a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      font-family: sans-serif;
      padding: 16px;
    }
    .instrucao {
      color: #00d592;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .img-box {
      background-color: #ffffff;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
    }
    img {
      width: 200px;
      height: 200px;
      object-fit: contain;
      user-select: auto;
      -webkit-user-select: auto;
      -webkit-touch-callout: default;
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <div class="instrucao">
    Toque e segure na imagem abaixo e selecione:<br>
    👉 "Copiar imagem"[cite: 2]
  </div>

  <div class="img-box">
    <!-- Referência direta para a pasta figurinhas -->
    <img src="figurinhas/d43.gif" alt="Figurinha Animada">
  </div>

</body>
</html>
